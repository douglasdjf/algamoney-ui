<div class="container">
  <form autocomplete="off" (ngSubmit)="salvar()" [formGroup]="formulario">

    <div class="p-grid">
      <div class="p-col-12">
        <h1>{{ editando ? 'Edição de' : 'Nova' }} Pessoa</h1>
      </div>

      <div class="p-col-12 p-fluid">
        <label>Nome</label>
        <input pInputText type="text" name="nome"
        formControlName="nome">

        <app-message [control]="formulario.get('nome')" error="required"
          text="Informe o nome"></app-message>

         <app-message [control]="formulario.get('nome')" error="minlength"
          text="Mínimo de {{ formulario.get('nome')?.errors?.minlength?.requiredLength }} caracteres">
        </app-message> 
      </div>

      <div class="p-col-12 p-md-9 p-fluid" formGroupName="endereco">
        <label>Logradouro</label>
        <input pInputText type="text" name="endereco" formControlName="logradouro" >

        <app-message [control]="formulario.get('endereco.logradouro')" error="required"
          text="Informe o logradouro"></app-message>

        <app-message [control]="formulario.get('endereco.logradouro')" error="minlength" text=" Mínimo de {{ formulario.get('endereco.logradouro')?.errors?.minlength?.requiredLength}} caracteres"></app-message> 
      </div>

      <div class="p-col-12">
        <button pButton type="submit" label="Salvar"  class="p-button-sm" [disabled]="formulario.invalid"></button>
