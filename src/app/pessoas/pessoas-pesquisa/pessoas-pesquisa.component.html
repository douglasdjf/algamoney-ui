<div class="container">

 <form autocomplete="off" (ngSubmit)="pesquisar()">
  <div class="p-grid">
    <div class="p-col-12">
      <h1>Pessoas</h1>
    </div>

    <div class="p-col-12 p-fluid">
      <label>Nome</label>
      <input pInputText type="text" name="nome" [(ngModel)]="filtro.nome">
    </div>

    <div class="p-col-12">
      <button pButton type="submit" label="Pesquisar"></button>
    </div>
  </div>
 </form>

 <div class="p-grid">
    <div class="p-col-12">
        <p-table [value]="pessoas" [paginator]="true" [rows]="5" [lazy]="true" [totalRecords]="totalRegistros"
          [responsive]="true" (onLazyLoad)="aoMudarPagina($event)"
          #tabela>

          <ng-template pTemplate="header">
              <tr>
                <th pSortableColumn="nome">Nome <p-sortIcon field="nome"></p-sortIcon></th>
                <th pSortableColumn="cidade">Cidade <p-sortIcon field="cidade"></p-sortIcon></th>
                <th pSortableColumn="estado">Estado <p-sortIcon field="estado"></p-sortIcon></th>
                <th pSortableColumn="ativo">Status <p-sortIcon field="ativo"></p-sortIcon></th>
                <th class="col-acoes-header"></th>
              </tr>
          </ng-template>

          <ng-template pTemplate="body" let-pessoa>
            <tr>
              <td>
                <span class="p-column-title">Nome</span>
                {{ pessoa.nome }}
              </td>
              <td>
                <span class="p-column-title">Cidade</span>
                {{ pessoa.endereco.cidade }}
              </td>
              <td>
                <span class="p-column-title">Estado</span>
                {{ pessoa.endereco.estado }}
              </td>
              <td>
                <span class="p-column-title">Status</span>
                <a href="javascript:;" [pTooltip]="pessoa.ativo ? 'Desativar' : 'Ativar'"
                    tooltipPosition="top" (click)="alternarStatus(pessoa)">
                  {{ pessoa.ativo ? 'Ativo' : 'Inativo' }}
                </a>
              </td>
              <td class="col-acoes">
                <span class="p-column-title"></span>
                <a pButton icon="pi pi-pencil" pTooltip="Editar" tooltipPosition="top"></a>
                <button pButton icon="pi pi-trash" pTooltip="Excluir" tooltipPosition="top" (click)="confirmarExclusao(pessoa)"></button>
              </td>
            </tr>
          </ng-template>

          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="5">
                Nenhuma pessoa encontrada
              </td>
            </tr>
          </ng-template>

        </p-table>
    </div>

      
    <div class="p-col-12">
      <a pButton label="Nova Pessoa" routerLink="/pessoas/novo"></a>
    </div>
 </div>

</div>
