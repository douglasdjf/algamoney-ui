<p-table [value]="lancamentos" [paginator]="true" [rows]="5"  [showCurrentPageReport]="true" responsiveLayout="scroll"
    [responsive]="true"  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" [rowsPerPageOptions]="[5,10,15]">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="pessoa">Pessoa <p-sortIcon field="pessoa"></p-sortIcon></th>
      <th pSortableColumn="descricao">Descricao <p-sortIcon field="descricao"></p-sortIcon></th>
      <th pSortableColumn="dataVencimento">Vencimento <p-sortIcon field="dataVencimento"></p-sortIcon></th>
      <th pSortableColumn="dataPagamento">Pagamento <p-sortIcon field="dataPagamento"></p-sortIcon></th>
      <th pSortableColumn="valor">Valor <p-sortIcon field="valor"></p-sortIcon></th>
      <th class="col-acoes-header"></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-lancamento>
    <tr>
      <td>
        <span class="p-column-title">Pessoa</span>
        {{ lancamento.pessoa }}
      </td>
      <td>
        <span class="p-column-title">Descrição</span>
        {{ lancamento.descricao }}
      </td>
      <td class="col-data">
        <span class="p-column-title">Vencimento</span>
        {{ lancamento.dataVencimento | date:'dd/MM/yyyy' }}
      </td>
      <td class="col-data">
        <span class="p-column-title">Pagamento</span>
        {{ lancamento.dataPagamento | date:'dd/MM/yyyy' }}
      </td>
      <td class="col-valor">
        <span class="p-column-title">Valor</span>
        <span [style.color]="lancamento.tipo === 'DESPESA' ? 'red' : 'blue'">{{ lancamento.valor | number:'1.2-2' }}</span>
      </td>
      <td class="col-acoes">
        <span class="p-column-title"></span>
        <a pButton icon="pi pi-pencil" pTooltip="Editar" tooltipPosition="top"></a>
        <button pButton icon="pi pi-trash" pTooltip="Excluir" tooltipPosition="top"></button>
      </td>
    </tr>
  </ng-template>
</p-table>
